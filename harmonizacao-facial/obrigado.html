<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recebemos sua pré-avaliação — Dra. Nathalia Gomes</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/logo/favicon-64.png" sizes="64x64" type="image/png">

<style>
  .obrigado{
    min-height:100svh;display:flex;align-items:center;justify-content:center;
    padding:40px 22px;background:var(--cream);text-align:center;
  }
  .obrigado__card{max-width:520px;}
  .obrigado__mark{
    width:64px;height:64px;margin:0 auto 24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--ink);color:#f1e0c8;font-family:var(--display);font-size:1.5rem;font-weight:600;
  }
  .obrigado__mark img{width:60%;height:auto;display:block;}
  .obrigado p{color:var(--muted);}
  .obrigado .btn{margin-top:8px;}
  .obrigado__actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:26px;}
</style>
</head>

  <div class="obrigado">
